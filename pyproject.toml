[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-talk"
version = "0.1.0"
description = "Local-first file bus so coding agents can message each other."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fyang95" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
talk = "agent_talk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
